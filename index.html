<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC町田ゼルビア 2026/27 MATCH SCHEDULE (UNOFFICIAL)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E2354;
    --navy-2:#173071;
    --gold:#C9A24C;
    --gold-dark:#9C7A2E;
    --gold-light:#E8D08F;
    --surface:#FFFFFF;
    --bg:#E9ECF3;
    --on-surface:#1B1F27;
    --muted:#6B7280;
    --away:#173071;
    --sat:#1E6FE0;
    --sun:#E0293F;
    --elev1: 0 1px 2px rgba(16,24,40,.10), 0 1px 3px rgba(16,24,40,.08);
    --elev2: 0 2px 6px rgba(16,24,40,.14), 0 1px 2px rgba(16,24,40,.10);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:"Roboto","Noto Sans JP",sans-serif;
    color:var(--on-surface);
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }

  /* ===== App bar ===== */
  .appbar{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(135deg,var(--navy) 0%, var(--navy-2) 100%);
    color:#fff;
    box-shadow:var(--elev2);
    padding:18px 20px 16px;
  }
  .appbar-row{display:flex; align-items:center; gap:14px;}
  .appbar-title small{
    display:block; font-size:12px; letter-spacing:2px; color:var(--gold);
    font-weight:700; text-transform:uppercase;
  }
  .appbar-title h1{
    margin:2px 0 0; font-size:20px; font-weight:900; letter-spacing:.5px;
    line-height:1.3;
  }
  @media (max-width:480px){
    .appbar-title h1{font-size:16px;}
  }

  /* ===== Tabs (competition filter) ===== */
  .tabs{
    display:flex; gap:8px; margin-top:16px; overflow-x:auto;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:none; padding:8px 16px; border-radius:20px;
    background:rgba(255,255,255,.10); color:#dfe6f5;
    font-size:13px; font-weight:700; cursor:pointer; user-select:none;
    border:1px solid rgba(255,255,255,.18);
    transition:background .15s,color .15s,transform .1s;
    white-space:nowrap;
  }
  .tab:active{transform:scale(.96);}
  .tab.active{background:var(--gold); color:var(--navy); border-color:var(--gold);}

  /* ===== Controls bar (column toggle) ===== */
  .controls{
    max-width:1180px; margin:16px auto 4px; padding:0 16px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .result-count{font-size:13px; color:var(--muted); font-weight:500;}
  .jump-next{
    display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700;
    color:var(--navy-2); background:#fff; border:1px solid #D6DCE8;
    padding:7px 12px; border-radius:20px; cursor:pointer; box-shadow:var(--elev1);
    transition:background .15s;
  }
  .jump-next:hover{background:#F3F5FA;}
  .jump-next svg{width:14px;height:14px;}
  .colswitch{
    display:inline-flex; background:#fff; border-radius:24px; padding:4px;
    box-shadow:var(--elev1); gap:2px;
  }
  .colswitch button{
    border:none; background:transparent; width:40px; height:36px; border-radius:20px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--away); transition:background .15s,color .15s;
  }
  .colswitch button.active{background:var(--navy); color:#fff;}
  .colswitch svg{width:18px;height:18px;}

  /* ===== Grid ===== */
  .wrap{max-width:1180px; margin:0 auto; padding:8px 16px 0;}
  .grid{
    display:grid; gap:14px; margin-top:10px;
  }
  .grid.cols-1{grid-template-columns:1fr;}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}

  /* 縦持ち（portrait）のときだけ、画面幅に応じて列数を制限する。
     横持ち（landscape）はここに引っかからないので、選んだ列数（最大3列）をそのまま反映する。 */
  @media (max-width:820px) and (orientation:portrait){
    .grid.cols-3{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:480px) and (orientation:portrait){
    .grid.cols-2, .grid.cols-3{grid-template-columns:1fr;}
  }

  /* スマホ横持ちなど、幅が狭いのに3列にする場合はカードを少しコンパクトにする */
  @media (max-width:900px) and (orientation:landscape){
    .grid.cols-3 .card{padding:11px 11px 10px 14px;}
    .grid.cols-3 .date-badge{font-size:26px;}
    .grid.cols-3 .opponent-crest{width:44px;height:44px;}
    .grid.cols-3 .opponent-name{font-size:14px;}
  }

  /* ===== Section label ===== */
  .section-label{
    font-size:13px; font-weight:700; color:var(--navy-2); letter-spacing:1px;
    margin:22px 2px 4px; text-transform:uppercase; opacity:.7;
  }

  /* ===== Card ===== */
  .card{
    position:relative; overflow:hidden;
    background:var(--surface); border-radius:var(--radius);
    box-shadow:var(--elev1);
    padding:14px 14px 12px 17px;
    display:flex; flex-direction:column; gap:10px;
    cursor:pointer;
    transition:box-shadow .18s ease, transform .18s ease;
    border:1px solid rgba(16,24,40,.05);
    border-left:5px solid transparent;
  }
  .card:hover{box-shadow:var(--elev2); transform:translateY(-2px);}
  .card.home{
    background:linear-gradient(150deg, var(--navy) 0%, var(--navy-2) 100%);
    border-left-color:var(--gold);
    color:#fff;
  }
  .card.away{
    background:var(--surface);
    border-left-color:var(--navy);
  }

  .card.home .round-chip{background:var(--gold); color:var(--navy);}
  .card.home .opponent-name{color:#fff;}
  .card.home .opponent-sub{color:var(--gold-light);}
  .card.home .opponent-crest{background:#fff; border-color:rgba(255,255,255,.35);}
  .card.home .card-bottom{border-top-color:rgba(255,255,255,.22);}
  .card.home .date-badge{color:#fff;}
  .card.home .time-txt{color:rgba(255,255,255,.72);}
  .card.home .stadium-txt{color:var(--gold-light);}
  .card.home .stadium-txt svg{opacity:.85;}
  .card.home .note-txt{color:var(--gold);}
  .card.home .day-pill.wk{background:rgba(255,255,255,.22);}

  .card.away .round-chip{background:var(--navy); color:#fff;}
  .card.away .opponent-name{color:var(--on-surface);}
  .card.away .opponent-sub{color:var(--muted);}
  .card.away .stadium-txt{color:var(--navy-2);}

  /* ===== 大会別の左ラインカラー（J1以外はH/Aに関わらずこちらを優先） ===== */
  .card[data-comp="ACL2"]{border-left-color:#16A2F1;}
  .card[data-comp="EMP"]{border-left-color:#191919;}
  .card[data-comp="YBC"]{border-left-color:#E00014;}
  .ripple{
    position:absolute; border-radius:50%; transform:scale(0);
    background:rgba(14,35,84,.16); animation:ripple .5s ease-out;
    pointer-events:none;
  }
  @keyframes ripple{ to{transform:scale(3); opacity:0;} }

  .card-top{display:flex; align-items:center; justify-content:space-between;}
  .round-chip{
    font-size:11px; font-weight:700; color:#fff; background:var(--navy);
    padding:3px 9px; border-radius:8px; letter-spacing:.5px;
  }
  .comp-chip{
    font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.5px;
  }
  .ha-chip{
    font-size:11px; font-weight:900; padding:3px 10px; border-radius:8px;
    letter-spacing:.5px;
  }
  .ha-chip.H{background:var(--gold); color:var(--navy);}
  .ha-chip.A{background:var(--navy); color:#fff;}
  .ha-chip.T{background:#DCE3EE; color:var(--navy-2);}

  .card-mid{display:flex; align-items:center; gap:12px;}
  .opponent-crest{
    width:56px; height:56px; border-radius:50%; background:#F4F6FA;
    border:1px solid #E4E8F0; flex:none;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .opponent-crest img{width:78%;height:78%;object-fit:contain;}
  .opponent-crest.placeholder{
    background:var(--navy); color:#fff; font-weight:900; font-size:15px;
    letter-spacing:.5px; font-family:"Roboto Condensed",sans-serif;
  }
  .acl-banner{
    grid-column:1/-1; background:linear-gradient(135deg,var(--navy),var(--navy-2));
    color:#fff; border-radius:var(--radius); padding:16px 18px;
    box-shadow:var(--elev1); font-size:13px; line-height:1.7;
  }
  .acl-banner b{color:var(--gold); font-size:14px;}
  .opponent-name{font-size:16px; font-weight:700; line-height:1.25;}
  .opponent-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}

  .card-bottom{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    border-top:1px dashed #E4E8F0; padding-top:12px; margin-top:2px;
  }
  .card.home .card-bottom{border-top-style:dashed;}
  .date-badge{
    display:flex; align-items:baseline; gap:8px; font-family:"Roboto Condensed",sans-serif;
    font-weight:900; font-size:34px; line-height:1; color:var(--on-surface);
    letter-spacing:.5px;
  }
  .card.home .date-badge{color:#fff;}
  .day-pill{
    font-size:12px; font-weight:700; color:#fff; padding:3px 9px; border-radius:6px;
  }
  .day-pill.sat{background:var(--sat);}
  .day-pill.sun{background:var(--sun);}
  .day-pill.wk{background:var(--away);}
  .time-txt{font-size:13px; color:var(--muted); font-weight:500; margin-left:auto;}
  .stadium-txt{
    font-size:12.5px; color:var(--navy-2); font-weight:500;
    display:flex; align-items:center; gap:5px; width:100%;
  }
  .stadium-txt svg{width:13px;height:13px;flex:none;opacity:.6;}
  .note-txt{font-size:11px; color:var(--gold-dark); font-weight:700; width:100%;}

  /* ===== Next match highlight ===== */
  .card.next{
    box-shadow:0 1px 2px rgba(16,24,40,.06), 0 14px 28px -6px rgba(20,30,60,.28), 0 0 0 1.5px var(--gold);
    transform:translateY(-4px);
    position:relative;
    z-index:2;
    overflow:visible;
  }
  .next-ribbon{
    position:absolute; top:50%; right:-4px;
    transform:translateY(-50%);
    background:#E0293F; color:#fff;
    font-size:12.5px; font-weight:900; letter-spacing:.3px;
    padding:9px 14px;
    border-radius:8px;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
    white-space:nowrap;
    z-index:4;
  }

  /* ===== Past match (already played) ===== */
  .card.past .card-content{opacity:.55; filter:saturate(.7); transition:opacity .18s ease;}
  .card.past:hover .card-content{opacity:.85;}
  .card.past.next .card-content{opacity:1;} /* 万一次の試合と重なった場合の保険 */
  .card-content{display:flex; flex-direction:column; gap:10px;}

  .result-stamp{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%) rotate(-8deg);
    font-size:26px; font-weight:900; letter-spacing:3px;
    padding:8px 26px;
    border-radius:10px;
    border:3px solid currentColor;
    background:rgba(20,24,32,.82);
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    z-index:3;
    pointer-events:none;
    white-space:nowrap;
  }
  .result-stamp.win{color:#4ADE80;}
  .result-stamp.lose{color:#F87171;}
  .result-stamp.draw{color:#D1D5DB;}

  .score-box{
    display:flex; align-items:center; gap:8px;
    font-family:"Roboto Condensed",sans-serif; font-weight:900;
    font-size:24px; line-height:1;
  }
  .score-box .sc{padding:2px 10px; border-radius:8px; background:rgba(0,0,0,.28);}
  .card.away .score-box .sc{background:rgba(14,35,84,.10); color:var(--navy);}
  .score-box .vs{font-size:12px; font-weight:700; opacity:.6;}

  footer{
    max-width:1180px; margin:28px auto 0; padding:0 16px;
    font-size:16px; color:var(--muted); line-height:1.7;
  }
  footer a{color:var(--navy-2);}
</style>
</head>
<body>

<div class="appbar">
  <div class="appbar-row">
    <div class="appbar-title">
      <small>2026 / 27</small>
      <h1>FC MACHIDA ZELVIA — MATCH SCHEDULE "UNOFFICIAL"</h1>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-comp="ALL">すべて</div>
    <div class="tab" data-comp="J1">J1リーグ</div>
    <div class="tab" data-comp="ACL2">ACL2</div>
    <div class="tab" data-comp="YBC">ルヴァンカップ</div>
    <div class="tab" data-comp="EMP">天皇杯</div>
  </div>
</div>

<div class="controls">
  <div class="result-count" id="count"></div>
  <div class="jump-next" id="jumpNext" title="次の試合へ">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
    次の試合へ
  </div>
  <div class="colswitch" id="colswitch">
    <button data-cols="1" title="1列">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="5" width="16" height="14" rx="2"/></svg>
    </button>
    <button data-cols="2" title="2列">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="8" height="14" rx="1.5"/><rect x="13" y="5" width="8" height="14" rx="1.5"/></svg>
    </button>
    <button data-cols="3" class="active" title="3列">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="5" width="6" height="14" rx="1.5"/><rect x="9" y="5" width="6" height="14" rx="1.5"/><rect x="16" y="5" width="6" height="14" rx="1.5"/></svg>
    </button>
  </div>
</div>

<div class="wrap">
  <div class="grid cols-3" id="grid"><p style="grid-column:1/-1;color:#8892a6;font-size:13px;">読み込み中...</p></div>
</div>

<footer>
  Jリーグ、FC町田ゼルビア公式サイトの情報をもとに作成した非公式ファン向け表示です。キックオフ時刻未定の試合は今後変更・確定される可能性があります。最新情報は<a href="https://www.zelvia.co.jp/match/game/series/2026-27/" target="_blank" rel="noopener">公式サイト</a>をご確認ください。
</footer>

<script>
const LOGO_BASE = "https://www.zelvia.co.jp/wp-content/themes/zelvia/assets/img/team_logo/";
let matches = [];
let nextMatch = null;
let nextMatchDaysLeft = null;
const compName = {J1:"明治安田J1リーグ", YBC:"ルヴァンカップ", EMP:"天皇杯", ACL2:"AFCチャンピオンズリーグ2"};

// 閲覧している「今日」を自動計算（毎回最新の日付を基準にする）
function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
const TODAY = todayStr();

async function loadSchedule(){
  try{
    const res = await fetch('./schedule.json', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    matches = await res.json();
    matches.sort((a,b)=> a.sort.localeCompare(b.sort));
    nextMatch = matches.find(m => m.sort >= TODAY) || null;
    if(nextMatch){
      const msPerDay = 24*60*60*1000;
      const d0 = new Date(TODAY + "T00:00:00");
      const d1 = new Date(nextMatch.sort + "T00:00:00");
      nextMatchDaysLeft = Math.round((d1 - d0) / msPerDay);
    }
    render();
  }catch(err){
    grid.innerHTML = `<div class="acl-banner" style="background:#7A1F2B;">
      日程データの読み込みに失敗しました（schedule.json）。<br>
      同じフォルダに index.html と schedule.json を一緒に置いているか確認してください。<br>
      <span style="opacity:.7;font-size:11px;">${err}</span></div>`;
    countEl.textContent = '';
  }
}

function cardHTML(m){
  const compShort = {YBC:"ルヴァン", EMP:"天皇杯", ACL2:"ACL2"};
  const roundLabel = (m.comp==="J1") ? `第${m.round}節` : `${compShort[m.comp] || m.comp} ${m.round}`;
  const dayClass = m.day==="sat" ? "sat" : (m.day==="sun" ? "sun" : "wk");
  const haState = m.home===true ? 'home' : (m.home===false ? 'away' : '');
  const haLabel = m.home===true ? 'HOME' : (m.home===false ? 'AWAY' : 'TBD');
  const haClass = m.home===true ? 'H' : (m.home===false ? 'A' : 'T');
  const crestInner = m.logoText
    ? m.logoText
    : `<img src="${LOGO_BASE}${m.logo}" alt="${m.opp}" loading="lazy">`;
  const crestClass = m.logoText ? 'opponent-crest placeholder' : 'opponent-crest';
  const isPast = m.sort < TODAY;
  const isNext = m === nextMatch;
  const stateClass = [haState, isPast?'past':'', isNext?'next':''].filter(Boolean).join(' ');

  // 消化済み試合のスコア表示
  let resultStamp = '';
  let scoreBox = '';
  if (m.played && typeof m.scoreZelvia === 'number' && typeof m.scoreOpp === 'number') {
    const diff = m.scoreZelvia - m.scoreOpp;
    const result = diff > 0 ? 'win' : (diff < 0 ? 'lose' : 'draw');
    const resultLabel = diff > 0 ? 'WIN' : (diff < 0 ? 'LOSE' : 'DRAW');
    resultStamp = `<div class="result-stamp ${result}">${resultLabel}</div>`;
    const zelviaScoreSpan = `<span class="sc" style="background:var(--gold);color:var(--navy);">${m.scoreZelvia}</span>`;
    const oppScoreSpan = `<span class="sc">${m.scoreOpp}</span>`;
    // ホームなら「町田 - 相手」、アウェイなら「相手 - 町田」の順（=常に開催地のホームチームが左）
    const orderedScores = m.home ? `${zelviaScoreSpan}<span class="vs">−</span>${oppScoreSpan}`
                                  : `${oppScoreSpan}<span class="vs">−</span>${zelviaScoreSpan}`;
    scoreBox = `<div class="score-box">${orderedScores}</div>`;
  }

  return `
  <div class="card ${stateClass}" data-comp="${m.comp}" ${isNext?'id="next-match"':''}>
    ${isNext?`<div class="next-ribbon">${nextMatchDaysLeft===0 ? '本日開催' : (nextMatchDaysLeft===1 ? '明日開催' : `試合まであと${nextMatchDaysLeft}日`)}</div>`:''}
    ${resultStamp}
    <div class="card-content">
    <div class="card-top">
      <span class="round-chip">${roundLabel}</span>
      <span class="ha-chip ${haClass}">${haLabel}</span>
    </div>
    <div class="card-mid">
      <div class="${crestClass}">${crestInner}</div>
      <div style="flex:1;">
        <div class="opponent-name">${m.opp}</div>
        <div class="opponent-sub">${compName[m.comp]}</div>
      </div>
      ${scoreBox}
    </div>
    <div class="card-bottom">
      <div class="date-badge">${m.date}<span class="day-pill ${dayClass}">${m.dayLabel}</span></div>
      <div class="time-txt">${m.played ? '試合終了' : (m.time + (m.time!=="未定"?" KO":""))}</div>
      <div class="stadium-txt">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        ${m.stadium}
      </div>
      ${m.note?`<div class="note-txt">★ ${m.note}</div>`:""}
    </div>
    </div>
  </div>`;
}

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
let currentComp = 'ALL';
let firstRender = true;

function render(){
  const list = matches.filter(m => currentComp==='ALL' || m.comp===currentComp);
  let html = '';
  if(currentComp === 'ACL2'){
    html += `<div class="acl-banner"><b>AFCチャンピオンズリーグ2 2026/27 グループG</b><br>
      町田は上海申花（中国）、スヴァイリエンFC（カンボジア）、タンピネス・ローバースFC（シンガポール）と対戦。
      第1日〜第6日、全日程確定済みです。</div>`;
  }
  html += list.map(cardHTML).join('');
  grid.innerHTML = html;
  countEl.textContent = `${list.length} 試合`;
  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', function(e){
      const r = document.createElement('span');
      r.className='ripple';
      const rect = this.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      r.style.width = r.style.height = size+'px';
      r.style.left = (e.clientX-rect.left-size/2)+'px';
      r.style.top = (e.clientY-rect.top-size/2)+'px';
      this.appendChild(r);
      setTimeout(()=>r.remove(),500);
    });
  });
  if(firstRender){
    firstRender = false;
    const nextEl = document.getElementById('next-match');
    if(nextEl){
      setTimeout(()=> nextEl.scrollIntoView({behavior:'smooth', block:'center'}), 300);
    }
  }
}

document.getElementById('tabs').addEventListener('click', e=>{
  const t = e.target.closest('.tab');
  if(!t) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  currentComp = t.dataset.comp;
  render();
});

document.getElementById('colswitch').addEventListener('click', e=>{
  const b = e.target.closest('button');
  if(!b) return;
  document.querySelectorAll('#colswitch button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  grid.className = 'grid cols-'+b.dataset.cols;
});

document.getElementById('jumpNext').addEventListener('click', ()=>{
  const el = document.getElementById('next-match');
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
});

loadSchedule();
</script>
</body>
</html>

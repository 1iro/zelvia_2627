name: Update Zelvia schedule

on:
  schedule:
    # 毎日 日本時間 23:00 に実行（UTC 14:00 = JST 同日23:00）
    - cron: "0 14 * * *"
  workflow_dispatch: {}   # Actionsタブから手動実行もできるようにする

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        id: scrape
        run: |
          python3 scripts/update_schedule.py

      - name: Commit & push if changed
        run: |
          git config user.name "zelvia-schedule-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain schedule.json)" ]; then
            git add schedule.json
            git commit -m "chore: auto-update schedule.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No changes to schedule.json"
          fi
